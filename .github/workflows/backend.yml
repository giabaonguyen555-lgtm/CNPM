git statusname: Backend

on:
  workflow_call:

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cnpm
      ACCESS_TOKEN_SECRET: ci-test-access-token-secret
      ADMIN_API_KEY: ci-test-admin-key
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cnpm
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d cnpm"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:init
      - run: npm run test:api
      - name: Health check
        run: |
          PORT=8787 node backend/index.mjs > server.log 2>&1 &
          for i in {1..20}; do
            curl --fail --silent http://127.0.0.1:8787/health && exit 0
            sleep 1
          done
          cat server.log
          exit 1
